<!-- Auto-Slider Styles & Responsive Enhancements for Product Modal -->
<style>
	#modalSliderViewport {
		position: relative;
		user-select: none;
		touch-action: pan-y pinch-zoom;
	}

	@media (max-width: 640px) {
		#modalSliderViewport,
		#modalSliderViewport > div.relative {
			height: 280px !important;
		}
	}

	@media (min-width: 641px) and (max-width: 1024px) {
		#modalSliderViewport,
		#modalSliderViewport > div.relative {
			height: 340px !important;
		}
	}

	#modalSliderTrack {
		will-change: transform;
	}

	.modal-thumb-item {
		transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
	}

	.modal-thumb-item.active {
		border-color: #facc15 !important;
		box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.35);
		transform: scale(1.04);
		opacity: 1 !important;
		background-color: #ffffff !important;
	}

	/* Mobile fullscreen modal */
	@media (max-width: 767px) {
		#quickViewModal .modal-dialog {
			margin: 0;
			max-height: 100vh;
			height: 100vh;
		}
		
		#quickViewModal .modal-content {
			height: 100vh;
			border-radius: 0;
		}
		
		#quickViewModal .modal-body {
			overflow-y: auto;
			-webkit-overflow-scrolling: touch;
			padding-bottom: 2.5rem;
		}

		/* Make buttons touch-friendly */
		#quickViewModal .btn {
			min-height: 44px;
		}
		
		/* Improve table readability */
		#quickViewModal table td {
			word-break: break-word;
		}
	}
	
	/* Tablet and above */
	@media (min-width: 768px) {
		#quickViewModal .modal-body {
			max-height: 85vh;
			overflow-y: auto;
		}
	}
</style>

<!-- Product Modal Auto-Slider Controller Script -->
<script>
(function() {
	let currentSlide = 0;
	const totalSlides = 4;
	let autoSlideInterval = null;
	let isPaused = false;
	let isUserPaused = false;
	const SLIDE_DURATION = 2800; // 2.8s per slide for brisk, dynamic presentation

	function updateSlide(index, animate = true) {
		currentSlide = ((index % totalSlides) + totalSlides) % totalSlides;
		const track = document.getElementById('modalSliderTrack');
		if (track) {
			track.style.transition = animate ? 'transform 0.45s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
			track.style.transform = `translateX(-${currentSlide * 100}%)`;
		}

		// Update slide counter
		const currentEl = document.getElementById('modalSlideCurrent');
		if (currentEl) currentEl.textContent = currentSlide + 1;

		// Update thumbnails
		const thumbs = document.querySelectorAll('#productModalThumbnails .modal-thumb-item');
		thumbs.forEach((thumb, idx) => {
			if (idx === currentSlide) {
				thumb.classList.add('active');
				thumb.classList.remove('opacity-60');
				thumb.classList.add('opacity-100');
			} else {
				thumb.classList.remove('active');
				thumb.classList.add('opacity-60');
				thumb.classList.remove('opacity-100');
			}
		});

		// Reset progress bar
		restartProgressBar();
	}

	function startAutoSlide() {
		stopAutoSlide();
		if (isUserPaused) return;

		updateAutoPlayUI(true);
		restartProgressBar();

		autoSlideInterval = setInterval(() => {
			if (!isPaused && !isUserPaused) {
				updateSlide(currentSlide + 1, true);
			}
		}, SLIDE_DURATION);
	}

	function stopAutoSlide() {
		if (autoSlideInterval) {
			clearInterval(autoSlideInterval);
			autoSlideInterval = null;
		}
		resetProgressBar();
	}

	function restartProgressBar() {
		const bar = document.getElementById('modalSliderProgressBar');
		if (!bar) return;

		bar.style.transition = 'none';
		bar.style.width = '0%';

		if (isPaused || isUserPaused) return;

		// Trigger reflow to restart CSS transition
		void bar.offsetWidth;

		bar.style.transition = `width ${SLIDE_DURATION}ms linear`;
		bar.style.width = '100%';
	}

	function resetProgressBar() {
		const bar = document.getElementById('modalSliderProgressBar');
		if (!bar) return;
		bar.style.transition = 'none';
		bar.style.width = '0%';
	}

	function updateAutoPlayUI(active) {
		const indicator = document.getElementById('modalAutoPlayIndicator');
		const label = document.getElementById('modalAutoPlayLabel');
		if (indicator) {
			indicator.className = active ? 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' : 'w-2 h-2 rounded-full bg-gray-400';
		}
		if (label) {
			label.textContent = active ? 'Auto-Slide' : 'Paused';
		}
	}

	// Global API to update images and kick off auto-slide
	window.setModalSliderImages = function(images) {
		if (!Array.isArray(images) || images.length === 0) return;

		const imgIds = ['modalMainImage', 'modalImage2', 'modalImage3', 'modalImage4'];
		const thumbIds = ['modalThumb1', 'modalThumb2', 'modalThumb3', 'modalThumb4'];

		for (let i = 0; i < 4; i++) {
			const src = images[i] || images[0];
			const imgEl = document.getElementById(imgIds[i]);
			const thumbEl = document.getElementById(thumbIds[i]);
			if (imgEl) imgEl.src = src;
			if (thumbEl) thumbEl.src = src;
		}

		currentSlide = 0;
		updateSlide(0, false);
		isPaused = false;
		isUserPaused = false;
		startAutoSlide();
	};

	window.initModalSlider = function() {
		currentSlide = 0;
		updateSlide(0, false);
		isPaused = false;
		isUserPaused = false;
		startAutoSlide();
	};

	window.stopModalSlider = function() {
		stopAutoSlide();
	};

	// Bind controls on DOM ready
	function initEvents() {
		const viewport = document.getElementById('modalSliderViewport');
		const prevBtn = document.getElementById('modalPrevSlide');
		const nextBtn = document.getElementById('modalNextSlide');
		const autoPlayToggle = document.getElementById('modalAutoPlayToggle');
		const modal = document.getElementById('quickViewModal');

		if (prevBtn) {
			prevBtn.addEventListener('click', (e) => {
				e.preventDefault();
				e.stopPropagation();
				updateSlide(currentSlide - 1);
				if (!isUserPaused) startAutoSlide();
			});
		}

		if (nextBtn) {
			nextBtn.addEventListener('click', (e) => {
				e.preventDefault();
				e.stopPropagation();
				updateSlide(currentSlide + 1);
				if (!isUserPaused) startAutoSlide();
			});
		}

		// Thumbnail click navigation
		document.querySelectorAll('#productModalThumbnails .modal-thumb-item').forEach((thumb) => {
			thumb.addEventListener('click', (e) => {
				e.preventDefault();
				const idx = parseInt(thumb.dataset.slideIndex, 10);
				if (!isNaN(idx)) {
					updateSlide(idx);
					if (!isUserPaused) startAutoSlide();
				}
			});
		});

		// Hover to pause auto-slide
		if (viewport) {
			viewport.addEventListener('mouseenter', () => {
				isPaused = true;
				const bar = document.getElementById('modalSliderProgressBar');
				if (bar) {
					const computedWidth = window.getComputedStyle(bar).width;
					bar.style.transition = 'none';
					bar.style.width = computedWidth;
				}
			});

			viewport.addEventListener('mouseleave', () => {
				isPaused = false;
				if (!isUserPaused) {
					restartProgressBar();
				}
			});

			// Touch swipe gestures for mobile
			let touchStartX = 0;
			let touchEndX = 0;
			viewport.addEventListener('touchstart', (e) => {
				touchStartX = e.changedTouches[0].screenX;
			}, { passive: true });

			viewport.addEventListener('touchend', (e) => {
				touchEndX = e.changedTouches[0].screenX;
				const diff = touchEndX - touchStartX;
				if (Math.abs(diff) > 40) {
					if (diff < 0) {
						updateSlide(currentSlide + 1);
					} else {
						updateSlide(currentSlide - 1);
					}
					if (!isUserPaused) startAutoSlide();
				}
			}, { passive: true });
		}

		// Manual Auto-Play toggle button
		if (autoPlayToggle) {
			autoPlayToggle.addEventListener('click', (e) => {
				e.preventDefault();
				e.stopPropagation();
				isUserPaused = !isUserPaused;
				if (isUserPaused) {
					stopAutoSlide();
					updateAutoPlayUI(false);
				} else {
					updateAutoPlayUI(true);
					startAutoSlide();
				}
			});
		}

		// Bootstrap modal lifecycle hooks
		if (modal) {
			modal.addEventListener('shown.bs.modal', () => {
				updateSlide(0, false);
				isUserPaused = false;
				isPaused = false;
				startAutoSlide();
			});

			modal.addEventListener('hidden.bs.modal', () => {
				stopAutoSlide();
			});
		}

		// Keyboard arrow keys navigation
		document.addEventListener('keydown', (e) => {
			if (!modal || !modal.classList.contains('show')) return;
			if (e.key === 'ArrowLeft') {
				updateSlide(currentSlide - 1);
				if (!isUserPaused) startAutoSlide();
			} else if (e.key === 'ArrowRight') {
				updateSlide(currentSlide + 1);
				if (!isUserPaused) startAutoSlide();
			}
		});
	}

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', initEvents);
	} else {
		initEvents();
	}
})();
</script>
